[package]
name = "em_t_pc"
version = "0.1.0"
description = "Siber guvenlik egitim uygulamasi"
authors = ["em_t_pc"]
edition = "2021"

[lib]
name = "em_t_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.1", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
